services:
  roombook:
    build: .
    image: roombook:latest
    container_name: roombook
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      TIMEZONE: Asia/Bangkok
      CLIENT_URL: ${CLIENT_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      SESSION_KEY1: ${SESSION_KEY1}
      SESSION_KEY2: ${SESSION_KEY2}
      ALLOWED_HOSTED_DOMAIN: ${ALLOWED_HOSTED_DOMAIN}
      ADMIN_EMAILS: "nont.naraphat@21sunpassion.com,it@21sunpassion.com"
      OUR_DOMAINS: "21sunpassion.com,office21sun.com"
      GOOGLE_ADMIN_SUBJECT: "nont.naraphat@21sunpassion.com"
      GOOGLE_SERVICE_ACCOUNT_FILE: "/app/secrets/sa-roombook.json"
    volumes:
      - /volume1/docker/roombook-secrets/sa-roombook.json:/app/secrets/sa-roombook.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
